<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آلة حاسبة</title>
<style>
  :root { --bg:#111; --key:#2a2a2e; --op:#ff9f0a; --fn:#4a4a50; --txt:#fff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--txt);
    font-family:system-ui,sans-serif; user-select:none; }
  .app { height:100%; display:flex; flex-direction:column; direction:ltr;
    padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 12px); }
  .screen { flex:1; display:flex; flex-direction:column; justify-content:flex-end;
    align-items:flex-end; padding:16px 8px; overflow:hidden; }
  #e { color:#999; font-size:20px; min-height:26px; }
  #d { font-size:clamp(40px,14vw,76px); font-weight:300; word-break:break-all; text-align:right; }
  .keys { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  button { border:0; border-radius:50%; aspect-ratio:1; font-size:28px; color:var(--txt);
    background:var(--key); }
  button:active { filter:brightness(1.4); }
  .fn { background:var(--fn); } .op { background:var(--op); }
  .zero { grid-column:span 2; border-radius:40px; aspect-ratio:auto; text-align:left; padding-left:12%; }
</style>
</head>
<body>
<div class="app">
  <div class="screen"><div id="e"></div><div id="d">0</div></div>
  <div class="keys" id="keys">
    <button class="fn" data-k="C">C</button>
    <button class="fn" data-k="neg">±</button>
    <button class="fn" data-k="%">%</button>
    <button class="op" data-k="÷">÷</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="op" data-k="×">×</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button class="op" data-k="−">−</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button class="op" data-k="+">+</button>
    <button class="zero" data-k="0">0</button>
    <button data-k=".">.</button>
    <button class="op" data-k="=">=</button>
  </div>
</div>
<script>
let cur = '0', prev = null, op = null, fresh = false;
const d = document.getElementById('d'), e = document.getElementById('e');

function fmt(n) {
  if (!isFinite(n)) return 'خطأ';
  return String(parseFloat(n.toPrecision(12)));
}
function calc(a, b, o) {
  a = parseFloat(a); b = parseFloat(b);
  if (o === '+') return fmt(a + b);
  if (o === '−') return fmt(a - b);
  if (o === '×') return fmt(a * b);
  if (o === '÷') return b === 0 ? 'خطأ' : fmt(a / b);
  return fmt(b);
}
function show() {
  d.textContent = cur;
  e.textContent = prev !== null ? prev + ' ' + op : '';
}
function press(k) {
  if (cur === 'خطأ' && k !== 'C') { cur = '0'; prev = null; op = null; }
  if (/^\d$/.test(k)) {
    if (fresh || cur === '0') cur = k; else if (cur.length < 15) cur += k;
    fresh = false;
  } else if (k === '.') {
    if (fresh) { cur = '0.'; fresh = false; } else if (!cur.includes('.')) cur += '.';
  } else if (['+', '−', '×', '÷'].includes(k)) {
    if (op && !fresh) cur = calc(prev, cur, op);
    prev = cur; op = k; fresh = true;
  } else if (k === '=') {
    if (op) { cur = calc(prev, cur, op); prev = null; op = null; fresh = true; }
  } else if (k === 'C') {
    cur = '0'; prev = null; op = null; fresh = false;
  } else if (k === 'neg') {
    if (cur !== '0') cur = cur.startsWith('-') ? cur.slice(1) : '-' + cur;
  } else if (k === '%') {
    cur = fmt(parseFloat(cur) / 100);
  }
  show();
}
document.getElementById('keys').addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if (b) press(b.dataset.k);
});
</script>
</body>
</html>
